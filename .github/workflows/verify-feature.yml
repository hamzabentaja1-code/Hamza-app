name: HamZa feature verification (no APK)

on:
  push:
    branches:
      - feature/accurate-profit-tracking
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: hamza-feature-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run domain and accessibility tests
        run: npm run test:quote
      - name: Validate TypeScript
        run: npx tsc --noEmit
