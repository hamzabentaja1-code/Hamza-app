name: Build HamZa Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: Check Expo project health (advisory)
        continue-on-error: true
        run: npx expo-doctor

      - name: Check Expo dependency compatibility (advisory)
        continue-on-error: true
        run: npx expo install --check

      - name: TypeScript validation
        run: npx tsc --noEmit

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean

      - name: Bundle JavaScript for standalone APK
        run: |
          mkdir -p android/app/src/main/assets
          npx expo export:embed --platform android --dev false --entry-file index.js --bundle-output android/app/src/main/assets/index.android.bundle --assets-dest android/app/src/main/res

      - name: Create temporary CI release signing key
        shell: bash
        run: |
          STORE_PASS="$(openssl rand -hex 24)"
          KEY_PASS="$STORE_PASS"
          KEY_FILE="$RUNNER_TEMP/hamza-ci-release.keystore"
          echo "::add-mask::$STORE_PASS"
          echo "::add-mask::$KEY_PASS"
          keytool -genkeypair -v -storetype PKCS12 -keystore "$KEY_FILE" \
            -alias hamza-release -keyalg RSA -keysize 3072 -sigalg SHA256withRSA \
            -validity 3650 -storepass "$STORE_PASS" -keypass "$KEY_PASS" \
            -dname "CN=HamZa Temporary CI Release, OU=Build, O=HamZa, C=MA"
          {
            echo "HAMZA_RELEASE_STORE_FILE=$KEY_FILE"
            echo "HAMZA_RELEASE_STORE_PASSWORD=$STORE_PASS"
            echo "HAMZA_RELEASE_KEY_ALIAS=hamza-release"
            echo "HAMZA_RELEASE_KEY_PASSWORD=$KEY_PASS"
          } >> "$GITHUB_ENV"

      - name: Configure release signing
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("android/app/build.gradle")
          s = p.read_text()
          if "signingConfigs {" not in s:
              raise SystemExit("Could not locate signingConfigs block in generated Gradle file")
          release_signing = """signingConfigs {
                  release {
                      storeFile file(System.getenv("HAMZA_RELEASE_STORE_FILE"))
                      storePassword System.getenv("HAMZA_RELEASE_STORE_PASSWORD")
                      keyAlias System.getenv("HAMZA_RELEASE_KEY_ALIAS")
                      keyPassword System.getenv("HAMZA_RELEASE_KEY_PASSWORD")
                  }
          """
          s = s.replace("signingConfigs {", release_signing, 1)
          m = re.search(r"buildTypes\s*\{", s)
          if not m:
              raise SystemExit("Could not locate buildTypes block in generated Gradle file")
          rel = re.search(r"release\s*\{", s[m.end():])
          if not rel:
              raise SystemExit("Could not locate release build type")
          start = m.end() + rel.start()
          brace = s.find("{", start)
          depth = 0
          end = None
          for i in range(brace, len(s)):
              if s[i] == "{": depth += 1
              elif s[i] == "}":
                  depth -= 1
                  if depth == 0:
                      end = i + 1
                      break
          if end is None:
              raise SystemExit("Could not parse release build type")
          block = s[start:end]
          block = re.sub(r"signingConfig\s+signingConfigs\.debug", "signingConfig signingConfigs.release", block)
          if "signingConfig signingConfigs.release" not in block:
              block = block.replace("{", "{\n            signingConfig signingConfigs.release", 1)
          s = s[:start] + block + s[end:]
          p.write_text(s)
          PY

      - name: Verify hardened Android configuration
        shell: bash
        run: |
          grep -Fq 'android.minSdkVersion=29' android/gradle.properties
          if grep -q 'android:usesCleartextTraffic="true"' android/app/src/main/AndroidManifest.xml; then
            echo "Cleartext traffic is still enabled"
            exit 1
          fi
          grep -n 'android.minSdkVersion' android/gradle.properties
          grep -n 'usesCleartextTraffic' android/app/src/main/AndroidManifest.xml || true

      - name: Build signed release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify APK signature
        shell: bash
        run: |
          APK="$(find android/app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HamZa-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

  mobsf:
    name: MobSF Android security scan
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: HamZa-APK
          path: dist/apk

      - name: Start MobSF container
        env:
          MOBSF_API_KEY: ${{ secrets.MOBSF_API_KEY }}
        run: |
          API_KEY="${MOBSF_API_KEY:-$(openssl rand -hex 32)}"
          echo "::add-mask::$API_KEY"
          echo "MOBSF_RUNTIME_API_KEY=$API_KEY" >> "$GITHUB_ENV"
          docker pull opensecurity/mobile-security-framework-mobsf:latest
          docker run -d --name mobsf -p 8000:8000 -e MOBSF_API_KEY="$API_KEY" opensecurity/mobile-security-framework-mobsf:latest
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/ >/dev/null; then
              echo "MobSF is ready"
              exit 0
            fi
            sleep 5
          done
          docker logs mobsf
          exit 1

      - name: Upload APK to MobSF and run static analysis
        run: |
          APK="$(find dist/apk -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          curl --fail-with-body -sS -X POST http://127.0.0.1:8000/api/v1/upload \
            -H "Authorization: $MOBSF_RUNTIME_API_KEY" \
            -F "file=@$APK" -o mobsf-upload.json
          HASH="$(jq -r '.hash // empty' mobsf-upload.json)"
          FILE_NAME="$(jq -r '.file_name // empty' mobsf-upload.json)"
          test -n "$HASH"
          echo "MOBSF_SCAN_HASH=$HASH" >> "$GITHUB_ENV"
          echo "MOBSF_FILE_NAME=$FILE_NAME" >> "$GITHUB_ENV"
          curl --fail-with-body -sS -X POST http://127.0.0.1:8000/api/v1/scan \
            -H "Authorization: $MOBSF_RUNTIME_API_KEY" \
            --data-urlencode "hash=$HASH" \
            --data-urlencode "file_name=$FILE_NAME" \
            --data-urlencode "scan_type=apk" -o mobsf-scan-response.json
          cat mobsf-scan-response.json

      - name: Export MobSF JSON security report
        run: |
          curl --fail-with-body -sS -X POST http://127.0.0.1:8000/api/v1/report_json \
            -H "Authorization: $MOBSF_RUNTIME_API_KEY" \
            --data-urlencode "hash=$MOBSF_SCAN_HASH" -o HamZa-MobSF-Report.json
          test -s HamZa-MobSF-Report.json
          jq '{app_name: .app_name, package_name: .package_name, security_score: .security_score, findings: (.appsec | {high: (.high|length), warning: (.warning|length)})}' HamZa-MobSF-Report.json || true

      - name: Upload MobSF report
        uses: actions/upload-artifact@v4
        with:
          name: HamZa-MobSF-Report
          path: |
            HamZa-MobSF-Report.json
            mobsf-scan-response.json
          if-no-files-found: error
          retention-days: 14

      - name: Stop MobSF container
        if: always()
        run: docker rm -f mobsf || true
