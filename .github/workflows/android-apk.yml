name: Build HamZa Android APK

on:
  push:
    branches: [main]
    paths-ignore:
      - '.devcontainer/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hamza-android-recovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install npm dependencies
        run: npm ci --no-audit --no-fund

      - name: Check Expo project health (advisory)
        continue-on-error: true
        run: npx expo-doctor

      - name: Check Expo dependency compatibility (advisory)
        continue-on-error: true
        run: npx expo install --check

      - name: Run business logic tests
        run: npm run test:domain

      - name: TypeScript validation
        run: npx tsc --noEmit

  release:
    name: Sign and test private HamZa APK
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/soxo9/hamza-completion'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment: hamza-android-release
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check release prereqs
        env:
          EXPECTED_SIGNER: ${{ vars.HAMZA_RELEASE_SIGNER_SHA256 }}
          RECIPIENT: ${{ vars.HAMZA_APK_RECIPIENT_CERT_B64 }}
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          [[ "$EXPECTED_SIGNER" =~ ^[0-9a-fA-F]{64}$ ]]
          test -n "$RECIPIENT"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Generate native Android project
        run: |
          npm ci --no-audit --no-fund
          npx expo prebuild --platform android --clean
          grep -Fq 'android.minSdkVersion=29' android/gradle.properties
          if grep -q 'android:usesCleartextTraffic="true"' android/app/src/main/AndroidManifest.xml; then
            echo "Cleartext traffic is still enabled"
            exit 1
          fi

      - name: Build unsigned Android release
        working-directory: android
        shell: bash
        run: |
          # RN's default generated release build type points to its debug signing config.
          # Remove that reference, leaving the optimized release recipe and JavaScript unchanged.
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path("app/build.gradle")
          source, count = re.subn(r"(\brelease\s*\{[^{}]*?)^[ 	]*signingConfig[ 	]+signingConfigs\.debug[ 	]*$", r"\1", path.read_text(), flags=re.M)
          if count != 1:
              raise SystemExit("Could not unambiguously remove the generated debug release signature")
          path.write_text(source)
          PY
          ./gradlew assembleRelease --no-daemon

      - name: Sign the single release APK
        env:
          HAMZA_RELEASE_KEYSTORE_B64: ${{ secrets.HAMZA_RELEASE_KEYSTORE_B64 }}
          HAMZA_RELEASE_STORE_PASSWORD: ${{ secrets.HAMZA_RELEASE_STORE_PASSWORD }}
          HAMZA_RELEASE_KEY_ALIAS: ${{ vars.HAMZA_RELEASE_KEY_ALIAS }}
          HAMZA_RELEASE_KEY_PASSWORD: ${{ secrets.HAMZA_RELEASE_KEY_PASSWORD }}
          HAMZA_RELEASE_SIGNER_SHA256: ${{ vars.HAMZA_RELEASE_SIGNER_SHA256 }}
        run: bash scripts/sign-hamza-release.sh android/app/build/outputs/apk/release dist/signed

      - name: Verify the exact APK matches phone and emulator ABIs
        run: |
          bash scripts/verify-android-smoke.sh dist/signed arm64-v8a
          bash scripts/verify-android-smoke.sh dist/signed x86_64

      - name: Verify KVM on hosted Linux
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          test -c /dev/kvm && test -r /dev/kvm && test -w /dev/kvm

      - name: Install and run Maestro tests on the exact release
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-linux-hw-accel: false
          disable-animations: false
          script: bash scripts/verify-android-smoke.sh dist/signed x86_64 --run

      - name: Encrypt the unchanged tested release for private delivery
        env:
          HAMZA_APK_RECIPIENT_CERT_B64: ${{ vars.HAMZA_APK_RECIPIENT_CERT_B64 }}
        run: bash scripts/encrypt-hamza-release.sh dist/signed dist/private/HamZa.cms

      - name: Upload only encrypted release
        uses: actions/upload-artifact@v4
        with:
          name: HamZa-private-release
          path: dist/private/HamZa.cms
          if-no-files-found: error
          retention-days: 3
