appId: com.hamza.app
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "HamZa"
    timeout: 30000
- assertVisible: "HamZa"
- assertVisible: "الرئيسية"
- assertVisible: "المنتجات"
- scrollUntilVisible:
    element:
      text: "نقطة البيع"
    direction: DOWN
    timeout: 20000
- tapOn: "نقطة البيع"
- assertVisible: "البحث عن منتج"
- tapOn: "⌂ الرئيسية"
- assertVisible: "HamZa"
- tapOn: "AR"
- assertVisible: "Gestion commerciale"
- assertVisible: "FR"
- takeScreenshot: artifacts/home-fr
- stopApp
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: "Gestion commerciale"
    timeout: 30000
- assertVisible: "FR"
- tapOn: "FR"
- assertVisible: "تسيير تجاري"
- assertVisible: "AR"
- takeScreenshot: artifacts/home-ar
- stopApp
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: "تسيير تجاري"
    timeout: 30000
- assertVisible: "AR"
